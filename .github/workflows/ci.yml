name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Run Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy-${{ runner.os }}.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ runner.os }}
          path: clippy-${{ runner.os }}.log
      - run: cargo test --all-targets
