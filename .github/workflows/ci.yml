name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Run Clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy-${{ runner.os }}.log
        continue-on-error: true
      - name: Commit diagnostics temporarily
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clippy-Linux.log -f
          git commit -m "Add temporary Clippy diagnostics" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ runner.os }}
          path: clippy-${{ runner.os }}.log
      - run: cargo test --all-targets
